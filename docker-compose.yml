# Startup order: db, embedding, cache -> server -> client
services:
  cache:
    build: ./cache
    restart: unless-stopped

  db:
    build: ./db
    restart: unless-stopped
    volumes:
      - chroma_data:/data

  embedding:
    build: ./embedding
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  server:
    build: ./server
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_healthy
      cache:
        condition: service_healthy

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  chroma_data:
  ollama_models:
